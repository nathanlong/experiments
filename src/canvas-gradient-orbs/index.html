<!doctype html>
<html class="" lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canvas/Shader Gradient Orbs</title>
    <meta
      name="description"
      content="Peformant shader-based lava-lamp effect"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <canvas
      data-component="canvas-gradient"
      data-bg="#0a0a1a"
      data-colors="['#3b82f6', '#8b5cf6', '#06b6d4', '#ec4899']"
      data-resolution="0.5"
    ></canvas>

    <button data-component="gradient-tween">Change Colors</button>

    <script type="module" src="./script.ts"></script>
  </body>
</html>
